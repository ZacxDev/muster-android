<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- __FIT__ is replaced by the activity: "cover" or "auto". -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=__FIT__">
<style>
  /* 777px is a sentinel: it shows only when env() is NOT defined. 0px means
     defined and zero. */
  :root {
    --sat: env(safe-area-inset-top, 777px);
    --sab: env(safe-area-inset-bottom, 777px);
    --sal: env(safe-area-inset-left, 777px);
    --sar: env(safe-area-inset-right, 777px);
  }
  html, body { margin: 0; height: 100%; background: #fde; }
  #probe {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    padding-top: env(safe-area-inset-top, 777px);
    padding-bottom: env(safe-area-inset-bottom, 777px);
    padding-left: env(safe-area-inset-left, 777px);
    padding-right: env(safe-area-inset-right, 777px);
    box-sizing: border-box;
  }
  #inner { background: #cfc; height: 100%; font: 14px sans-serif; }
</style>
</head>
<body>
<div id="probe"><div id="inner">S12 safe-area probe. Green = inside safe area.</div></div>
<script>
  function report(when) {
    var cs = getComputedStyle(document.getElementById('probe'));
    var root = getComputedStyle(document.documentElement);
    console.log('when=' + when +
      ' padding[t=' + cs.paddingTop + ' b=' + cs.paddingBottom + ' l=' + cs.paddingLeft + ' r=' + cs.paddingRight + ']' +
      ' vars[t=' + root.getPropertyValue('--sat').trim() + ' b=' + root.getPropertyValue('--sab').trim() + ']' +
      ' inner=' + window.innerWidth + 'x' + window.innerHeight + ' dpr=' + window.devicePixelRatio +
      ' ua=' + (navigator.userAgent.match(/Chrome\/[\d.]+/) || ['?'])[0]);
  }
  report('load');
  setTimeout(function () { report('500ms'); }, 500);
  setTimeout(function () { report('3s'); }, 3000);
  window.addEventListener('resize', function () { report('resize'); });
</script>
</body>
</html>
