name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # No signing here, ever: CI builds a debug-signed APK (throwaway debug key
    # generated by AGP on the runner) and runs unit tests. The release key is
    # generated and kept offline by the operator (README).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # CI uses the RUNNER's Android SDK, not the flake's (Nix + androidenv
      # would download the SDK on every run). The runner image ships an SDK
      # with licences accepted; AGP installs any missing platform or
      # build-tools on demand. compileSdk is pinned in Gradle and build-tools
      # by the pinned AGP version, so both build against the same SDK levels.
      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Debug APKs
        run: ./gradlew --no-daemon assembleDebug

      # The UNSIGNED release APK, and the offline signing script exercised
      # against it with a throwaway key made and deleted inside the test.
      # Nothing here is a release: no release key exists in CI.
      - name: Unsigned release APK and the signing script's test
        run: |
          ./gradlew --no-daemon assembleRelease
          scripts/tests/sign-release-test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
