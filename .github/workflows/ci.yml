name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # No signing here, ever: CI builds a debug-signed APK (throwaway debug key
    # generated by AGP on the runner) and runs unit tests. The release key is
    # generated and kept offline by the operator (README).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # The runner image ships an Android SDK with licences accepted; AGP
      # installs any missing platform / build-tools on demand.
      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Debug APKs
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
